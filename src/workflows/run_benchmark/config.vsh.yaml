name: run_benchmark
namespace: workflows

argument_groups:
  - name: Inputs
    arguments:
      - name: "--input_train"
        __merge__: /src/api/file_train.yaml
        type: file
        direction: input
        required: true
      - name: "--input_test"
        __merge__: /src/api/file_test.yaml
        type: file
        direction: input
        required: true
      - name: "--input_solution"
        __merge__: /src/api/file_solution.yaml
        type: file
        direction: input
        required: true
  - name: Outputs
    arguments:
      - name: "--output_results"
        type: file
        required: true
        direction: output
        description: |
          A directory containing the results of the benchmark:

            * `score_uns.yaml`: the scores of each of the methods
            * `dataset_uns.yaml`: the metadata of the datasets
            * `method_configs.yaml`: the configs of the methods
            * `metric_configs.yaml`: the configs of the metrics
            * `task_info.yaml`: the task info
            * `stored_outputs.yaml`: which outputs were stored with `--store_steps`, and what they are
        default: results
  - name: Intermediate outputs
    description: |
      By default, only the results are published. The outputs of the methods and
      metrics stay in the Nextflow work directory.
    arguments:
      - name: "--store_steps"
        type: string
        multiple: true
        choices: [method, metric]
        description: |
          The steps of which the outputs are published as well, next to the results.
          The output of a step is stored at the id of its run, e.g.
          `<dataset_id>/<method_id>/<paramset_name>/prediction.anndata.zarr`. The dataset,
          method, paramset and metric of each stored output are listed in `stored_outputs.yaml`
          in the results, so they do not need to be derived from its path.
  - name: Method filtering
    description: |
      Use these arguments to filter methods by name. By default, all methods are
      run. If `--methods_include` is defined, only those methods are run. If
      `--methods_exclude` is defined, all methods except those specified are run.
      These arguments are mutually exclusive, so only `--methods_include` OR
      `--methods_exclude` can set but not both.
    arguments:
      - name: "--paramsets"
        type: file
        direction: input
        required: false
        description: |
          A yaml file mapping method ids to named parameter sets, e.g.:

            logistic_regression:
              strong_regularization:
                inverse_regularization_strength: 0.1
              weak_regularization:
                inverse_regularization_strength: 10.0

          Each listed method is run once per parameter set, with the given arguments
          and with `paramset_name`/`paramset` attached to its scores.
          If not provided, the parameter sets default to the `info.variants`
          defined in the method components' configs. A method without
          `info.variants` is run once with its default parameter set.
      - name: "--methods_include"
        type: string
        multiple: true
        description: |
          A list of method ids to include. If specified, only these methods will be run.
          For parameterised methods, a single paramset can be targeted as `<method_id>.<paramset_name>`, e.g. `logistic_regression.strong_regularization`.
      - name: "--methods_exclude"
        type: string
        multiple: true
        description: |
          A list of method ids to exclude. If specified, all methods except the ones listed will be run.
          For parameterised methods, a single paramset can be excluded as `<method_id>.<paramset_name>`, e.g. `logistic_regression.strong_regularization`.
  - name: Metric filtering
    description: |
      Use these arguments to filter metrics by name. By default, all metrics are
      run. If `--metrics_include` is defined, only those metrics are run. If
      `--metrics_exclude` is defined, all metrics except those specified are run.
      These arguments are mutually exclusive, so only `--metrics_include` OR
      `--metrics_exclude` can set but not both.
    arguments:
      - name: "--metrics_include"
        type: string
        multiple: true
        description: |
          A list of metric ids to include. If specified, only these metrics will be run.
      - name: "--metrics_exclude"
        type: string
        multiple: true
        description: |
          A list of metric ids to exclude. If specified, all metrics except the ones listed will be run.

resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf
  - type: file
    path: /_viash.yaml
  - path: /common/nextflow_helpers/helper.nf

dependencies:
  - name: utils/extract_uns_metadata
    repository: openproblems
  - name: control_methods/true_labels
  - name: control_methods/random_labels
  - name: methods/logistic_regression
  - name: metrics/accuracy

runners:
  - type: nextflow
